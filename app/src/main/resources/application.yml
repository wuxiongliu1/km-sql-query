spring:
  datasource:
    url: jdbc:sqlite:km-sql-query.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.sqlite.hibernate.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

spring.servlet.multipart.max-request-size: 10MB
